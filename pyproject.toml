[project]
name = "prestress"
version = "0.1.0"
description = "Augmented iterative method for a homeostatic prestressed reference configuration in constrained mixture models"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
